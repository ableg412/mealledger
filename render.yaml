# Render Blueprint — deploys MealLedger as two services:
#   1. mealledger-api      (Node web service, Express + TS)
#   2. mealledger-frontend (Static site, Vite build output)
#
# To deploy:
#   1. Push this repo to GitHub.
#   2. In Render: New → Blueprint → connect the repo → Apply.
#   3. Render will create both services and link the env vars below.

services:
  # ─── Backend API ───────────────────────────────────────────
  - type: web
    name: mealledger-api
    runtime: node
    plan: free                    # bump to "starter" before launch
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000              # Render's default for web services
      - key: CORS_ORIGIN
        # Allow the static site to call the API. Render fills this in
        # using the frontend service's URL.
        fromService:
          type: web
          name: mealledger-frontend
          property: hostport

  # ─── Frontend (Vite static build) ──────────────────────────
  - type: web
    name: mealledger-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    pullRequestPreviewsEnabled: true
    envVars:
      # The frontend bakes this in at build time so it knows where
      # to POST demo requests in production.
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: mealledger-api
          property: host
    # SPA fallback — sends all unknown paths to index.html so client
    # routing works once we add /app/* routes.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
